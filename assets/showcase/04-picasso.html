<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>피카소 타이머</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:Georgia,"Times New Roman",'Pretendard',serif;
    background:#E3D6B6;
    display:flex;align-items:center;justify-content:center;color:#241c14;padding:14px}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:13px;width:100%;max-width:288px}
  .art{width:200px;height:208px;filter:drop-shadow(0 9px 16px rgba(80,60,30,.26))}
  .art svg{width:100%;height:100%;display:block}
  .time{font-family:Georgia,serif;font-weight:700;font-size:40px;color:#241c14;letter-spacing:1px}
  .time .cs{font-size:18px;color:#9E3526}
  .row{display:flex;gap:8px}
  button{font-family:Georgia,'Pretendard',serif;font-weight:700;font-size:14px;cursor:pointer;padding:11px 0;width:80px;
    border:2px solid #1B1510;background:#E3D6B6;color:#1B1510;border-radius:2px;transition:transform .07s,background .15s;
    box-shadow:3px 3px 0 rgba(27,21,16,.9)}
  button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(27,21,16,.9)}
  #b1{background:#C79A4C;border-color:#7a5a16}#b1.run{background:#9E3526;color:#fff;border-color:#6e2016}
  #b2{background:#6E8294;color:#fff}#b3{background:#E3D6B6}
  button:disabled{opacity:.42;cursor:default}
  .lp{font-size:12px;color:#7a6a4c;min-height:15px;font-style:italic}
  button:focus-visible{outline:3px solid #9E3526;outline-offset:2px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 200 212">
        <!-- 배경 면 -->
        <rect x="0" y="0" width="200" height="212" fill="#D9CBA6"/>
        <path d="M0,0 H84 L72,212 H0 Z" fill="#AEB79C"/>
        <path d="M84,0 H200 V70 H150 L128,22 Z" fill="#D8C58C"/>
        <path d="M150,0 H200 V74 H150 Z" fill="#71808B"/>
        <path d="M150,150 H200 V212 H150 Z" fill="#9A7B5E"/>
        <path d="M72,212 L112,82 L150,212 Z" fill="#CBB881" opacity=".55"/>
        <line x1="122" y1="0" x2="122" y2="212" stroke="#1B1510" stroke-width="1.2" opacity=".22"/>

        <!-- 머리카락 -->
        <path d="M38,64 L76,20 L126,12 L164,40 L154,54 L116,30 L82,36 L52,72 Z" fill="#181612"/>
        <path d="M58,50 L82,14 L126,12 L94,38 Z" fill="#2B2822"/>
        <path d="M152,38 L166,42 L160,92 L136,58 Z" fill="#5D3E29"/>

        <!-- 얼굴 면 -->
        <path d="M82,30 L118,26 L152,44 L164,92 L150,151 L112,198 L63,160 L48,101 L55,55 Z" fill="#C9B07A"/>
        <path d="M55,55 L118,26 L106,92 L50,105 Z" fill="#E0CF9E"/>
        <path d="M106,92 L118,26 L152,44 L164,92 L148,151 L126,121 Z" fill="#B96F4D"/>
        <path d="M48,101 L106,92 L84,158 L63,160 Z" fill="#AF9560"/>
        <path d="M106,92 L126,121 L112,198 L84,158 Z" fill="#D3BC7C"/>
        <path d="M126,121 L148,151 L112,198 L113,148 Z" fill="#7A684E"/>
        <path d="M48,101 L55,55 L63,75 L60,110 Z" fill="#607686"/>
        <path d="M65,118 L88,132 L79,151 Z" fill="#8F7A56" opacity=".55"/>
        <path d="M106,92 L126,121 L110,149 L100,119 Z" fill="#E0CF9E" opacity=".55"/>

        <!-- 목 -->
        <path d="M92,198 L122,198 L116,212 L98,212 Z" fill="#B96F4D" stroke="#1B1510" stroke-width="3"/>

        <!-- 굵은 외곽선 -->
        <path d="M82,30 L118,26 L152,44 L164,92 L150,151 L112,198 L63,160 L48,101 L55,55 Z"
              fill="none" stroke="#1B1510" stroke-width="4.4" stroke-linejoin="round"/>
        <path d="M38,64 L76,20 L126,12 L164,40" fill="none" stroke="#1B1510" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- 옆얼굴 코와 중앙 분할 -->
        <path d="M108,34 L101,72 L96,94 L130,106 L107,119 L113,149"
              fill="none" stroke="#1B1510" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M119,101 q11,4 7,13" fill="none" stroke="#1B1510" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M78,34 L106,92 L84,158" fill="none" stroke="#6D593A" stroke-width="2" opacity=".35"/>

        <!-- 눈썹 -->
        <path d="M54,82 L80,73 L95,83" fill="none" stroke="#1B1510" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M116,69 L138,60 L158,74" fill="none" stroke="#1B1510" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- 왼쪽 눈 -->
        <path d="M55,96 Q76,85 99,94 Q78,105 55,96 Z" fill="#EFE6CE" stroke="#1B1510" stroke-width="3" stroke-linejoin="round"/>
        <path d="M55,96 Q77,84 99,94" fill="none" stroke="#1B1510" stroke-width="3.4" stroke-linecap="round"/>
        <ellipse cx="78" cy="95" rx="7" ry="7.5" fill="#40361F"/>

        <!-- 오른쪽 눈 -->
        <path d="M116,82 Q137,72 159,82 Q138,92 116,82 Z" fill="#EFE6CE" stroke="#1B1510" stroke-width="3" stroke-linejoin="round"/>
        <path d="M116,82 Q137,71 159,82" fill="none" stroke="#1B1510" stroke-width="3.4" stroke-linecap="round"/>
        <ellipse cx="138" cy="82" rx="7.5" ry="8" fill="#3F5663"/>

        <!-- 입과 턱 -->
        <path d="M81,154 Q101,160 136,150 Q119,153 103,154 Q92,154 81,154 Z" fill="#9E3526"/>
        <path d="M81,154 Q103,169 136,150 Q116,163 100,162 Q90,159 81,154 Z" fill="#C2674A"/>
        <path d="M81,154 Q104,156 136,150" fill="none" stroke="#1B1510" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M70,160 L112,198 L148,151" fill="none" stroke="#1B1510" stroke-width="2" opacity=".28"/>

        <!-- 점과 작은 면 조각 -->
        <circle cx="151" cy="116" r="3.2" fill="#1B1510"/>
        <path d="M133,118 L148,146 L126,121 Z" fill="#5E7180" opacity=".36"/>
      </svg>
    </div>
    <div class="time"><span id="t">00:00<span class="cs">.00</span></span></div>
    <div class="row">
      <button id="b2" disabled>랩</button>
      <button id="b1">시작</button>
      <button id="b3" disabled>초기화</button>
    </div>
    <div class="lp" id="lp"></div>
  </div>
<script>
(function(){
  var t=document.getElementById('t'),b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3'),lp=document.getElementById('lp');
  var run=false,st=0,acc=0,iv=null,laps=[],last=0;
  function el(){return acc+(run?performance.now()-st:0);}
  function f(ms){if(ms<0)ms=0;var c=Math.floor(ms/10),cc=c%100,s=Math.floor(c/100),ss=s%60,mm=Math.floor(s/60);
    return String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'<span class="cs">.'+String(cc).padStart(2,'0')+'</span>';}
  function plain(ms){if(ms<0)ms=0;var c=Math.floor(ms/10),cc=c%100,s=Math.floor(c/100),ss=s%60,mm=Math.floor(s/60);
    return String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'.'+String(cc).padStart(2,'0');}
  function draw(){t.innerHTML=f(el());}
  function ui(){b1.textContent=run?'정지':(el()>0?'재개':'시작');b1.classList.toggle('run',run);b2.disabled=!run;b3.disabled=run||el()===0;}
  function start(){run=true;st=performance.now();if(!iv)iv=setInterval(draw,31);draw();ui();}
  function stop(){if(!run)return;acc=el();run=false;clearInterval(iv);iv=null;draw();ui();}
  function reset(){run=false;clearInterval(iv);iv=null;acc=0;st=0;laps=[];last=0;draw();ui();lp.textContent='';}
  function lap(){if(!run)return;var e=el(),sp=e-last;last=e;laps.push(sp);lp.textContent='구간 '+laps.length+'  +'+plain(sp);}
  b1.onclick=function(){run?stop():start();};b2.onclick=lap;b3.onclick=reset;
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&run)draw();});
  draw();ui();
})();
</script>
</body>
</html>
