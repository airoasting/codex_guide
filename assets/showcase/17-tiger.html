<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GPT 5.5 푸른 호랑이 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23090B12'/><text x='50' y='65' text-anchor='middle' font-size='54'>🐯</text></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:#F7FAFF;
    background:
      linear-gradient(135deg,rgba(83,91,255,.16),transparent 34%),
      radial-gradient(circle at 52% 30%,rgba(82,199,255,.18),transparent 32%),
      linear-gradient(180deg,#111522 0%,#070A12 100%);
    display:flex;align-items:center;justify-content:center;
    padding:12px;overflow:hidden;
  }
  .app{width:min(100%,304px);display:grid;gap:12px;justify-items:center;position:relative}
  .app::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;
    background-image:
      linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
    background-size:34px 34px;
    mask-image:radial-gradient(circle at center,#000 0%,transparent 70%);
  }
  .stage{width:236px;height:182px;position:relative;filter:drop-shadow(0 16px 28px rgba(0,0,0,.38))}
  .stage svg{width:100%;height:100%;display:block;overflow:visible}
  .ring{transform-box:fill-box;transform-origin:center;animation:ringPulse 4.2s ease-in-out infinite}
  .ring.r2{animation-delay:.7s}
  .spark{animation:spark 2.8s ease-in-out infinite}
  .spark.s2{animation-delay:.65s}
  .spark.s3{animation-delay:1.3s}
  .tiger-core{transform-box:fill-box;transform-origin:center}
  .run .tiger-core{animation:float 1s ease-in-out infinite}
  .run .scan{animation:scan 1.15s ease-in-out infinite}
  .run .eye-light{animation:eyeBeat .78s ease-in-out infinite}
  @keyframes ringPulse{0%,100%{opacity:.35;transform:scale(.98)}50%{opacity:.72;transform:scale(1.04)}}
  @keyframes spark{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes scan{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes eyeBeat{0%,100%{filter:drop-shadow(0 0 3px rgba(126,255,178,.5))}50%{filter:drop-shadow(0 0 12px rgba(126,255,178,.95))}}
  .time{
    font-variant-numeric:tabular-nums;
    font-size:46px;font-weight:900;letter-spacing:.5px;line-height:1;
    color:#F8FBFF;text-shadow:0 0 22px rgba(95,177,255,.38);
  }
  .time .cs{font-size:22px;color:#7CFFB2;margin-left:2px}
  .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
  button{
    font-family:inherit;height:42px;border:0;border-radius:14px;cursor:pointer;
    font-size:13px;font-weight:850;color:#F7FAFF;
    background:rgba(255,255,255,.1);border:1px solid rgba(185,214,255,.18);
    box-shadow:0 10px 20px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.16);
    transition:transform .08s,opacity .16s,background .16s;
  }
  button:active{transform:translateY(2px) scale(.98)}
  button:disabled{opacity:.42;cursor:default}
  #b1{background:linear-gradient(135deg,#3A32FF 0%,#47B8FF 100%);border-color:rgba(255,255,255,.22)}
  #b1.run{background:linear-gradient(135deg,#FF5568 0%,#FF9C55 100%)}
  #b2{background:rgba(124,255,178,.13)}
  #b3{background:rgba(255,255,255,.08)}
  button:focus-visible{outline:3px solid #7CFFB2;outline-offset:3px}
  .lap{min-height:18px;color:#9FB2D7;font-size:12px;font-weight:760;text-align:center}
  @media (prefers-reduced-motion:reduce){
    .ring,.spark,.run .tiger-core,.run .scan,.run .eye-light{animation:none!important}
  }
</style>
</head>
<body>
  <main class="app">
    <section class="stage" id="figure" aria-label="GPT 5.5 스타일 푸른 호랑이">
      <svg viewBox="0 0 260 198" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="푸른 호랑이 캐릭터">
        <defs>
          <linearGradient id="furA" x1="48" y1="15" x2="190" y2="170" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#9BC7FF"/><stop offset=".52" stop-color="#4E7EE8"/><stop offset="1" stop-color="#253B97"/>
          </linearGradient>
          <linearGradient id="furB" x1="75" y1="68" x2="190" y2="175" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#BFDFFF"/><stop offset="1" stop-color="#5C8EF0"/>
          </linearGradient>
          <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7CFFB2"/><stop offset="1" stop-color="#47B8FF"/>
          </linearGradient>
          <radialGradient id="eye" cx="42%" cy="36%" r="70%">
            <stop offset="0" stop-color="#F8FF90"/><stop offset=".44" stop-color="#FFB142"/><stop offset="1" stop-color="#EF3E24"/>
          </radialGradient>
          <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
        </defs>
        <g opacity=".6">
          <circle class="ring" cx="130" cy="96" r="86" fill="none" stroke="#47B8FF" stroke-width="1.4" stroke-dasharray="5 12"/>
          <circle class="ring r2" cx="130" cy="96" r="66" fill="none" stroke="#7CFFB2" stroke-width="1.2" stroke-dasharray="2 10"/>
          <path d="M36 66h34M190 66h34M24 128h42M196 128h40" stroke="#7FA3FF" stroke-width="1.5" stroke-linecap="round" opacity=".48"/>
          <circle class="spark" cx="45" cy="46" r="2.5" fill="#7CFFB2"/>
          <circle class="spark s2" cx="214" cy="52" r="2.5" fill="#47B8FF"/>
          <circle class="spark s3" cx="216" cy="148" r="2.8" fill="#BFD4FF"/>
        </g>
        <ellipse cx="130" cy="181" rx="68" ry="11" fill="#020711" opacity=".62"/>
        <g class="tiger-core">
          <path d="M70 136 C48 118 38 140 50 159 C62 175 82 166 90 150" fill="#2B4EB5"/>
          <path d="M61 143 C70 144 78 150 81 158" fill="none" stroke="#0A1E60" stroke-width="5" stroke-linecap="round"/>
          <ellipse cx="130" cy="135" rx="58" ry="47" fill="url(#furA)"/>
          <ellipse cx="130" cy="143" rx="32" ry="35" fill="url(#furB)" opacity=".92"/>
          <path d="M83 123 C70 137 72 164 91 171 L105 160 C96 143 101 128 112 119 Z" fill="#365FC6"/>
          <path d="M177 123 C190 137 188 164 169 171 L155 160 C164 143 159 128 148 119 Z" fill="#365FC6"/>
          <path d="M91 139 q15 -7 22 7M88 158 q13 -5 18 6M169 139 q-15 -7 -22 7M172 158 q-13 -5 -18 6" fill="none" stroke="#142B78" stroke-width="6" stroke-linecap="round"/>
          <path d="M75 79 C75 40 98 21 130 21 C162 21 185 40 185 79 C185 118 160 139 130 139 C100 139 75 118 75 79 Z" fill="url(#furA)"/>
          <path d="M83 42 C66 22 84 8 105 33 Z" fill="#5789F0"/>
          <path d="M177 42 C194 22 176 8 155 33 Z" fill="#5789F0"/>
          <path d="M88 34 C82 25 91 18 100 33 ZM172 34 C178 25 169 18 160 33 Z" fill="#142B78"/>
          <path d="M83 82 C68 101 77 122 103 121 C103 104 97 93 83 82 Z" fill="#6EA2F6" opacity=".78"/>
          <path d="M177 82 C192 101 183 122 157 121 C157 104 163 93 177 82 Z" fill="#6EA2F6" opacity=".78"/>
          <path d="M108 37 q6 11 0 25M130 32 v30M152 37 q-6 11 0 25" stroke="#142B78" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path class="scan" d="M72 78 H188" stroke="url(#neon)" stroke-width="2" opacity=".45"/>
          <g class="eye-light">
            <ellipse cx="105" cy="83" rx="24" ry="21" fill="#FF4C2E" opacity=".45" filter="url(#glow)"/>
            <ellipse cx="155" cy="83" rx="24" ry="21" fill="#FF4C2E" opacity=".45" filter="url(#glow)"/>
          </g>
          <ellipse cx="105" cy="83" rx="22" ry="20" fill="url(#eye)" stroke="#E7341A" stroke-width="3"/>
          <ellipse cx="155" cy="83" rx="22" ry="20" fill="url(#eye)" stroke="#E7341A" stroke-width="3"/>
          <ellipse cx="105" cy="84" rx="4.8" ry="16" fill="#07120E" stroke="#7CFFB2" stroke-width="1.3"/>
          <ellipse cx="155" cy="84" rx="4.8" ry="16" fill="#07120E" stroke="#7CFFB2" stroke-width="1.3"/>
          <circle cx="99" cy="74" r="3.6" fill="#FFF7D7"/>
          <circle cx="149" cy="74" r="3.6" fill="#FFF7D7"/>
          <path d="M99 111 Q114 126 130 113 Q146 126 161 111" fill="none" stroke="#10235F" stroke-width="4" stroke-linecap="round"/>
          <path d="M118 103 q12 -7 24 0 q-3 9 -24 0Z" fill="#FF6BA7"/>
          <path d="M87 100 q-29 -4 -45 -13M88 108 q-30 1 -47 4M172 100 q29 -4 45 -13M172 108 q30 1 47 4" stroke="#CFE8FF" stroke-width="2" stroke-linecap="round"/>
        </g>
      </svg>
    </section>
    <div class="time" aria-live="polite"><span id="t">00:00<span class="cs">.00</span></span></div>
    <div class="controls">
      <button id="b1" type="button">시작</button>
      <button id="b2" type="button" disabled>랩</button>
      <button id="b3" type="button" disabled>초기화</button>
    </div>
    <div class="lap" id="lp"></div>
  </main>
<script>
(function(){
  var time=document.getElementById('t');
  var startButton=document.getElementById('b1');
  var lapButton=document.getElementById('b2');
  var resetButton=document.getElementById('b3');
  var lapText=document.getElementById('lp');
  var figure=document.getElementById('figure');
  var running=false,startAt=0,stored=0,timer=null,lastLap=0,laps=0;
  function elapsed(){return stored+(running?performance.now()-startAt:0);}
  function format(ms,markup){
    ms=Math.max(0,ms);
    var cent=Math.floor(ms/10),cc=cent%100,sec=Math.floor(cent/100),ss=sec%60,min=Math.floor(sec/60);
    var base=String(min).padStart(2,'0')+':'+String(ss).padStart(2,'0');
    return markup?base+'<span class="cs">.'+String(cc).padStart(2,'0')+'</span>':base+'.'+String(cc).padStart(2,'0');
  }
  function draw(){time.innerHTML=format(elapsed(),true);}
  function sync(){
    var value=elapsed();
    startButton.textContent=running?'정지':(value>0?'재개':'시작');
    startButton.classList.toggle('run',running);
    lapButton.disabled=!running;
    resetButton.disabled=running||value===0;
    figure.classList.toggle('run',running);
  }
  function start(){running=true;startAt=performance.now();timer=setInterval(draw,31);draw();sync();}
  function stop(){if(!running)return;stored=elapsed();running=false;clearInterval(timer);timer=null;draw();sync();}
  function reset(){running=false;clearInterval(timer);timer=null;stored=0;startAt=0;lastLap=0;laps=0;lapText.textContent='';draw();sync();}
  function lap(){if(!running)return;var now=elapsed(),split=now-lastLap;lastLap=now;laps+=1;lapText.textContent='랩 '+laps+'  +'+format(split,false);}
  startButton.addEventListener('click',function(){running?stop():start();});
  lapButton.addEventListener('click',lap);
  resetButton.addEventListener('click',reset);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)draw();});
  draw();sync();
})();
</script>
</body>
</html>
