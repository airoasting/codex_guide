<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>픽셀 점프 스탑워치</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%235ab6ff'/><rect y='68' width='100' height='32' fill='%2370b646'/><rect x='36' y='34' width='28' height='28' fill='%23f6b73c'/></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    display:flex;align-items:center;justify-content:center;
    background:#10244A;color:#fff;padding:10px;overflow:hidden;
  }
  .game{
    width:min(100%,304px);
    background:#111827;
    border:4px solid #1A1D2B;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 18px 34px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.16);
  }
  .hud{
    height:38px;background:#111827;
    display:grid;grid-template-columns:1fr 1fr 1fr;
    align-items:center;padding:6px 10px 5px;
    font-family:"Courier New",monospace;
    font-size:10px;font-weight:900;letter-spacing:.5px;
    color:#F8F6D8;text-shadow:2px 2px 0 #000;
  }
  .hud b{display:block;color:#FFDE59;font-size:12px;line-height:1.1}
  .hud span:nth-child(2){text-align:center}
  .hud span:nth-child(3){text-align:right}
  .scene{
    position:relative;height:160px;overflow:hidden;
    background:linear-gradient(#5AB6FF 0%,#7ACBFF 62%,#8ED46E 62%,#6EB84A 100%);
    image-rendering:pixelated;
  }
  .scene::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(transparent 0 3px,rgba(0,0,0,.055) 3px 4px);
    pointer-events:none;
  }
  .world-track{
    position:absolute;left:0;top:0;width:608px;height:100%;
    transform:translateX(0);
    animation:worldScroll 4.8s linear infinite paused;
    z-index:1;
  }
  .run .world-track{animation-play-state:running}
  @keyframes worldScroll{from{transform:translateX(0)}to{transform:translateX(-304px)}}
  .world-set{position:absolute;top:0;width:304px;height:100%}
  .world-set.a{left:0}.world-set.b{left:304px}
  .cloud{position:absolute;background:#fff;border-radius:0;box-shadow:12px 0 0 #fff,24px 0 0 #fff,8px -8px 0 #fff,20px -8px 0 #fff}
  .cloud.c1{left:18px;top:23px;width:14px;height:12px}
  .cloud.c2{left:196px;top:36px;width:14px;height:12px;transform:scale(.9)}
  .hill{position:absolute;bottom:52px;width:50px;height:30px;background:#60C75A;border-radius:25px 25px 0 0;box-shadow:inset 0 0 0 4px rgba(255,255,255,.16)}
  .hill.h1{left:18px}.hill.h2{right:18px;width:68px;height:36px}
  .block{position:absolute;width:26px;height:26px;background:#D8782F;border:3px solid #8D4321;box-shadow:inset 3px 3px 0 #F0AA54,inset -3px -3px 0 #8D4321}
  .qblock{background:#F4B63E;border-color:#A35C20;box-shadow:inset 3px 3px 0 #FFE08D,inset -3px -3px 0 #A35C20}
  .qblock::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:"Courier New",monospace;font-size:17px;font-weight:900;color:#8A4A18;text-shadow:1px 1px 0 #FFE08D}
  .pipe{position:absolute;bottom:32px;width:44px;height:52px;background:#15A86C;border:4px solid #087747;box-shadow:inset 6px 0 0 rgba(255,255,255,.22),inset -6px 0 0 rgba(0,0,0,.16)}
  .pipe::before{content:"";position:absolute;left:-8px;top:-14px;width:60px;height:18px;background:#25C983;border:4px solid #087747;box-shadow:inset 6px 0 0 rgba(255,255,255,.22)}
  .pipe.p1{right:22px}
  .coin{
    position:absolute;width:12px;height:18px;border-radius:50%;
    background:#FFD84A;border:3px solid #B97918;
    box-shadow:inset 2px 0 0 rgba(255,255,255,.35);
    animation:coin 1.1s linear infinite paused;
  }
  .run .coin{animation-play-state:running}
  @keyframes coin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
  .coin.c1{left:72px;top:50px}.coin.c2{left:162px;top:50px}.coin.c3{left:198px;top:84px}
  .runner{
    position:absolute;left:27px;bottom:29px;width:62px;height:62px;z-index:4;
    transform:translateY(0);transform-origin:50% 100%;image-rendering:pixelated;
  }
  .run .runner{animation:runnerMotion 1.6s linear infinite}
  @keyframes runnerMotion{
    0%,24%,48%,100%{transform:translateY(0)}
    12%,36%,56%{transform:translateY(-2px)}
    72%{transform:translateY(-24px)}
    84%{transform:translateY(-12px)}
  }
  .sprite{
    width:100%;height:100%;display:block;overflow:visible;
    image-rendering:pixelated;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.35));
  }
  .sprite .o{fill:#20100B}.sprite .r{fill:#D92E2D}.sprite .rl{fill:#FF695B}.sprite .rd{fill:#961C20}
  .sprite .s{fill:#F6BE82}.sprite .sh{fill:#FFE0A9}.sprite .h{fill:#603018}.sprite .m{fill:#321B12}
  .sprite .b{fill:#1D63DD}.sprite .bd{fill:#113A98}.sprite .g{fill:#FFF2DE}.sprite .y{fill:#FFD94A}.sprite .k{fill:#6F3A1D}
  .sprite .frame-b{opacity:0}
  .run .sprite .frame-a{animation:frameA .24s steps(1,end) infinite}
  .run .sprite .frame-b{animation:frameB .24s steps(1,end) infinite}
  @keyframes frameA{0%,49.9%{opacity:1}50%,100%{opacity:0}}
  @keyframes frameB{0%,49.9%{opacity:0}50%,100%{opacity:1}}
  .ground{
    position:absolute;left:0;right:0;bottom:0;height:32px;
    background:
      linear-gradient(90deg,rgba(255,255,255,.12) 0 2px,transparent 2px 16px),
      linear-gradient(#B86E33,#8E4D25);
    background-size:16px 100%,100% 100%;
    border-top:4px solid #5F3A1C;
  }
  .panel{background:#111827;padding:11px 12px 13px}
  .time{
    text-align:center;font-family:"Courier New",monospace;
    font-size:34px;font-weight:900;line-height:1;
    color:#F8F6D8;text-shadow:3px 3px 0 #000;letter-spacing:1px;
    font-variant-numeric:tabular-nums;
  }
  .time .cs{font-size:18px;color:#FFDE59}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  button{
    height:40px;border:0;border-radius:9px;
    font-family:"Courier New",monospace;font-size:12px;font-weight:900;
    color:#fff;cursor:pointer;text-shadow:2px 2px 0 rgba(0,0,0,.35);
    box-shadow:0 5px 0 rgba(0,0,0,.38),inset 0 2px 0 rgba(255,255,255,.28);
    transition:transform .06s,filter .15s;
  }
  button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.38)}
  button:disabled{filter:grayscale(.65) brightness(.7);cursor:default}
  #b1{background:#EB3F3F}#b1.run{background:#2AC76B}
  #b2{background:#2F6FE8}#b3{background:#7B5A42}
  button:focus-visible{outline:3px solid #FFDE59;outline-offset:3px}
  .lap{height:18px;margin-top:8px;text-align:center;color:#A8D2FF;font-family:"Courier New",monospace;font-size:11px;font-weight:900;overflow:hidden}
  @media(prefers-reduced-motion:reduce){.world-track,.runner,.run .runner,.coin,.run .sprite .frame-a,.run .sprite .frame-b{animation:none!important}}
</style>
</head>
<body>
  <main class="game" id="game">
    <div class="hud" aria-hidden="true">
      <span>SCORE<b id="score">000000</b></span>
      <span>COIN<b id="coins">x00</b></span>
      <span>WORLD<b>1-9</b></span>
    </div>
    <section class="scene" aria-label="픽셀 플랫폼 게임 스테이지">
      <div class="world-track" aria-hidden="true">
        <div class="world-set a">
          <i class="cloud c1"></i><i class="cloud c2"></i>
          <i class="hill h1"></i><i class="hill h2"></i>
          <i class="block" style="left:78px;top:75px"></i>
          <i class="block qblock" style="left:104px;top:75px"></i>
          <i class="block" style="left:130px;top:75px"></i>
          <i class="block qblock" style="left:176px;top:100px"></i>
          <i class="coin c1"></i><i class="coin c2"></i><i class="coin c3"></i>
          <i class="pipe p1"></i>
          <i class="ground"></i>
        </div>
        <div class="world-set b">
          <i class="cloud c1"></i><i class="cloud c2"></i>
          <i class="hill h1"></i><i class="hill h2"></i>
          <i class="block" style="left:78px;top:75px"></i>
          <i class="block qblock" style="left:104px;top:75px"></i>
          <i class="block" style="left:130px;top:75px"></i>
          <i class="block qblock" style="left:176px;top:100px"></i>
          <i class="coin c1"></i><i class="coin c2"></i><i class="coin c3"></i>
          <i class="pipe p1"></i>
          <i class="ground"></i>
        </div>
      </div>
      <span class="runner" aria-hidden="true">
        <svg class="sprite" id="heroSprite" viewBox="0 0 32 32" shape-rendering="crispEdges" focusable="false"></svg>
      </span>
    </section>
    <section class="panel">
      <div class="time" aria-live="polite"><span id="t">00:00<span class="cs">.00</span></span></div>
      <div class="row">
        <button id="b2" type="button" disabled>LAP</button>
        <button id="b1" type="button">START</button>
        <button id="b3" type="button" disabled>RESET</button>
      </div>
      <div class="lap" id="lp">PRESS START</div>
    </section>
  </main>
<script>
(function(){
  var game=document.getElementById('game');
  var time=document.getElementById('t');
  var startButton=document.getElementById('b1');
  var lapButton=document.getElementById('b2');
  var resetButton=document.getElementById('b3');
  var lapText=document.getElementById('lp');
  var score=document.getElementById('score');
  var coins=document.getElementById('coins');
  var sprite=document.getElementById('heroSprite');
  var spriteMap={O:'o',R:'r',L:'rl',D:'rd',S:'s',T:'sh',H:'h',M:'m',B:'b',N:'bd',G:'g',Y:'y',K:'k'};
  var frameA=[
    '.........ORRRRRRRRRROO..........',
    '.......RRRRRRRYYYYDDDDOO........',
    '......ORRRLLLLYOOYRRRROOOO......',
    '.......RRRRRRRRRRRRRRRRRRRO.....',
    '.......OOOOOOOOOOOOOOODDDDO.....',
    '......OOOOOHHSSSSSSSSOOOO.......',
    '.....OOOOHHHHHSSTTSTTSSOOO......',
    '.....OOOHHHHHHSSSSSSOGSSSO......',
    '.....OOOHHHHHHSSSSSSOOSSSSS.....',
    '......OOHHHHHHSSSSSSOOSTTTT.....',
    '.......OOHHHHHSMMMMMMMMMMTT.....',
    '.........OOSSSSSSMMMMMMMMM......',
    '..........OOOOSSSSSSSMMMMM......',
    '.............OOOOOOOOOO.........',
    '.........OOOBBBOOOOOOOBBBOOOOOO.',
    '.......OOORRBBBLRRRRRRBBBRGGGGO.',
    '....GGGGGORRBBBBNNBBNNBBBDGGGGO.',
    '...OOGGGGORRBBBBBBBBBBBBBDGGGGO.',
    '...OOGGGGORRBBYYBBBBBYYBBDGGGGO.',
    '...OOOOOOORRBBYYBBBBBYYBBDGGGGO.',
    '...OOOOOO.RRBBBBBBNNNNBBBROOOOO.',
    '............BBBBBBNNNNBBB.......',
    '.............BBBBBNNNNBB........',
    '............OOBBBBBBBBBOO.......',
    '...........OBBBBBOBOBBBBBO......',
    '...........OBBBBBO.OBBBBBO......',
    '...........OBBBBBO.OBBBBBO......',
    '...........OBBBBBO.OBBBBBO......',
    '........KKKKKKKKKO.KKKKKKKKK....',
    '.......OKKKKKKKKO..OKKKKKKKKO...',
    '.......OOOOOOOOOO..OOOOOOOOOO...',
    '................................'
  ];
  var frameB=[
    '.........ORRRRRRRRRROO..........',
    '.......RRRRRRRYYYYDDDDOO........',
    '......ORRRLLLLYOOYRRRROOOO......',
    '.......RRRRRRRRRRRRRRRRRRRO.....',
    '.......OOOOOOOOOOOOOOODDDDO.....',
    '......OOOOOHHSSSSSSSSOOOO.......',
    '.....OOOOHHHHHSSTTSTTSSOOO......',
    '.....OOOHHHHHHSSSSSSOGSSSO......',
    '.....OOOHHHHHHSSSSSSOOSSSSS.....',
    '......OOHHHHHHSSSSSSOOSTTTT.....',
    '.......OOHHHHHSMMMMMMMMMMTT.....',
    '.........OOSSSSSSMMMMMMMMM......',
    '..........OOOOSSSSSSSMMMMM......',
    '.............OOOOOOOOOO.........',
    '.........OOOBBBOOOOOOOBBBO......',
    '...GGGGGGORRBBBLRRRRRRBBBROOO...',
    '..OGGGGGOORRBBBBNNBBNNBBBDOOOOO.',
    '..OGGGGGOORRBBBBBBBBBBBBBDGGGGO.',
    '..OGGGGGOORRBBYYBBBBBYYBBDGGGGO.',
    '..OOOOOOOORRBBYYBBBBBYYBBDGGGGO.',
    '..OOOOOOO.RRBBBBBBNNNNBBBRGGGGO.',
    '............BBBBBBNNNNBBB.OOOOO.',
    '.............BBBBBNNNNBB........',
    '............OOBBBBBBBBBOO.......',
    '.........OBBBBBBOBBBBOBBBBBO....',
    '.........OBBBBBBO....OBBBBBO....',
    '.........OBBBBBBO....OBBBBBO....',
    '.........OBBBBBBO....OBBBBBO....',
    '......KKKKKKKKKKO....OKKKKKKKK..',
    '.....OKKKKKKKKKO......OKKKKKKKO.',
    '.....OOOOOOOOOOO......OOOOOOOOO.',
    '................................'
  ];
  var running=false,startAt=0,stored=0,timer=null,lastLap=0,laps=0;
  function buildSprite(){
    var ns='http://www.w3.org/2000/svg';
    if(!sprite)return;
    [['frame-a',frameA],['frame-b',frameB]].forEach(function(frame){
      var group=document.createElementNS(ns,'g');
      group.setAttribute('class',frame[0]);
      frame[1].forEach(function(row,y){
        for(var x=0;x<32;){
          var ch=row[x]||'.';
          if(ch==='.'){x+=1;continue}
          var start=x;
          while(x<32 && (row[x]||'.')===ch)x+=1;
          var rect=document.createElementNS(ns,'rect');
          rect.setAttribute('x',start);
          rect.setAttribute('y',y);
          rect.setAttribute('width',x-start);
          rect.setAttribute('height',1);
          rect.setAttribute('class',spriteMap[ch]);
          group.appendChild(rect);
        }
      });
      sprite.appendChild(group);
    });
  }
  function elapsed(){return stored+(running?performance.now()-startAt:0)}
  function format(ms,markup){
    ms=Math.max(0,ms);
    var cent=Math.floor(ms/10),cc=cent%100,sec=Math.floor(cent/100),ss=sec%60,min=Math.floor(sec/60);
    var base=String(min).padStart(2,'0')+':'+String(ss).padStart(2,'0');
    return markup?base+'<span class="cs">.'+String(cc).padStart(2,'0')+'</span>':base+'.'+String(cc).padStart(2,'0');
  }
  function draw(){
    var value=elapsed();
    time.innerHTML=format(value,true);
    score.textContent=String(Math.min(999999,Math.floor(value/13))).padStart(6,'0');
    coins.textContent='x'+String((Math.floor(value/1000)%100)).padStart(2,'0');
  }
  function sync(){
    var value=elapsed();
    startButton.textContent=running?'STOP':(value>0?'GO':'START');
    startButton.classList.toggle('run',running);
    lapButton.disabled=!running;
    resetButton.disabled=running||value===0;
    game.classList.toggle('run',running);
  }
  function start(){running=true;startAt=performance.now();timer=setInterval(draw,31);draw();sync()}
  function stop(){if(!running)return;stored=elapsed();running=false;clearInterval(timer);timer=null;draw();sync()}
  function reset(){running=false;clearInterval(timer);timer=null;stored=0;startAt=0;lastLap=0;laps=0;lapText.textContent='PRESS START';draw();sync()}
  function lap(){if(!running)return;var now=elapsed(),split=now-lastLap;lastLap=now;laps+=1;lapText.textContent='LAP '+laps+'  +'+format(split,false)}
  startButton.addEventListener('click',function(){running?stop():start()});
  lapButton.addEventListener('click',lap);
  resetButton.addEventListener('click',reset);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)draw()});
  buildSprite();
  draw();sync();
})();
</script>
</body>
</html>
