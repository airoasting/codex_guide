<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GPT 5.5 피카소 타이머</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111622'/><text x='50' y='64' text-anchor='middle' font-size='52'>🎨</text></svg>" />
<style>
  @font-face{font-family:'Pretendard';src:url('../fonts/PretendardVariable.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:#F7FAFF;background:
      linear-gradient(135deg,rgba(58,50,255,.14),transparent 32%),
      radial-gradient(circle at 70% 22%,rgba(255,183,91,.18),transparent 28%),
      linear-gradient(180deg,#141722 0%,#080A11 100%);
    display:flex;align-items:center;justify-content:center;overflow:hidden;padding:12px;
  }
  .app{position:relative;width:min(100%,304px);display:grid;gap:12px;justify-items:center}
  .app::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.26;
    background-image:
      linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
    background-size:36px 36px;
    mask-image:radial-gradient(circle at 50% 45%,#000 0%,transparent 72%);
  }
  .canvas{width:236px;height:184px;position:relative;filter:drop-shadow(0 16px 28px rgba(0,0,0,.34))}
  .canvas svg{width:100%;height:100%;display:block;overflow:visible}
  .panel-line{animation:linePulse 4s ease-in-out infinite}
  .panel-line.l2{animation-delay:.8s}
  .portrait{transform-box:fill-box;transform-origin:center}
  .run .portrait{animation:breathe 1.1s ease-in-out infinite}
  .run .scan{animation:scan 1.2s ease-in-out infinite}
  .run .iris{animation:look 1.6s ease-in-out infinite}
  @keyframes linePulse{0%,100%{opacity:.28}50%{opacity:.72}}
  @keyframes breathe{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-3px) rotate(.8deg)}}
  @keyframes scan{0%,100%{opacity:.2;transform:translateX(-8px)}50%{opacity:.9;transform:translateX(8px)}}
  @keyframes look{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}
  .time{
    font-variant-numeric:tabular-nums;
    font-size:46px;font-weight:920;letter-spacing:.5px;line-height:1;
    color:#FFFFFF;text-shadow:0 0 24px rgba(255,207,107,.34);
  }
  .time .cs{font-size:22px;color:#FFCF6B;margin-left:2px}
  .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
  button{
    font-family:inherit;height:42px;border:0;border-radius:13px;cursor:pointer;
    font-size:13px;font-weight:850;color:#F7FAFF;
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
    box-shadow:0 10px 20px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.14);
    transition:transform .08s,opacity .16s,background .16s;
  }
  button:active{transform:translateY(2px) scale(.98)}
  button:disabled{opacity:.42;cursor:default}
  #b1{background:linear-gradient(135deg,#FFCF6B 0%,#FF7C5B 100%);color:#111622;border-color:rgba(255,255,255,.2)}
  #b1.run{background:linear-gradient(135deg,#3A32FF 0%,#52C7FF 100%);color:#fff}
  #b2{background:rgba(82,199,255,.14)}
  #b3{background:rgba(255,255,255,.08)}
  button:focus-visible{outline:3px solid #FFCF6B;outline-offset:3px}
  .lap{min-height:18px;color:#B5C1DF;font-size:12px;font-weight:760;text-align:center}
  @media (prefers-reduced-motion:reduce){
    .panel-line,.run .portrait,.run .scan,.run .iris{animation:none!important}
  }
</style>
</head>
<body>
  <main class="app">
    <section class="canvas" id="figure" aria-label="GPT 5.5 스타일 큐비즘 얼굴">
      <svg viewBox="0 0 260 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="디지털 큐비즘 얼굴">
        <defs>
          <linearGradient id="cream" x1="70" y1="18" x2="160" y2="180" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FFF1BE"/><stop offset=".52" stop-color="#D8BD73"/><stop offset="1" stop-color="#88714E"/>
          </linearGradient>
          <linearGradient id="terra" x1="132" y1="42" x2="195" y2="160" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FF9B62"/><stop offset="1" stop-color="#9F513B"/>
          </linearGradient>
          <linearGradient id="blue" x1="64" y1="68" x2="96" y2="126" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#52C7FF"/><stop offset="1" stop-color="#3A32FF"/>
          </linearGradient>
          <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#252A3A"/><stop offset="1" stop-color="#10131D"/>
          </linearGradient>
          <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
        </defs>
        <rect x="14" y="8" width="232" height="184" rx="28" fill="rgba(255,255,255,.055)" stroke="rgba(255,255,255,.1)"/>
        <path d="M34 52 H85 V32 H162 V52 H220" class="panel-line" fill="none" stroke="#FFCF6B" stroke-width="1.3" stroke-linecap="round" opacity=".36"/>
        <path d="M38 154 H82 V176 H168 V154 H222" class="panel-line l2" fill="none" stroke="#52C7FF" stroke-width="1.3" stroke-linecap="round" opacity=".34"/>
        <circle cx="62" cy="58" r="3" fill="#FFCF6B" opacity=".8"/>
        <circle cx="210" cy="144" r="3" fill="#52C7FF" opacity=".72"/>
        <g class="portrait">
          <ellipse cx="132" cy="181" rx="58" ry="8" fill="#02040A" opacity=".55"/>
          <path d="M80 50 L116 22 L163 28 L198 58 L194 116 L168 158 L132 184 L84 148 L62 96 Z" fill="url(#cream)"/>
          <path d="M132 35 L163 28 L198 58 L194 116 L168 158 L132 184 L132 120 L151 105 L121 94 Z" fill="url(#terra)"/>
          <path d="M80 50 L116 22 L132 35 L121 94 L62 96 Z" fill="#FFE8A5"/>
          <path d="M62 96 L121 94 L102 152 L84 148 Z" fill="#B6995D"/>
          <path d="M121 94 L151 105 L132 120 L132 184 L102 152 Z" fill="#E3C87B"/>
          <path d="M151 105 L194 116 L168 158 L132 184 L132 120 Z" fill="#7F6A52"/>
          <path d="M62 96 L80 50 L78 118 Z" fill="url(#blue)" opacity=".8"/>
          <path d="M102 152 L132 184 L168 158 L132 120 Z" fill="#111622" opacity=".16"/>
          <path d="M78 47 L116 18 L166 21 L204 56 L194 58 L156 36 L112 36 L82 68 Z" fill="#11110F"/>
          <path d="M190 55 L204 56 L196 100 L170 69 Z" fill="#5F3B2C"/>
          <path d="M92 22 L116 12 L166 21 L128 36 Z" fill="#27231E"/>
          <path d="M80 50 L116 22 L163 28 L198 58 L194 116 L168 158 L132 184 L84 148 L62 96 Z"
                fill="none" stroke="#090B12" stroke-width="4.6" stroke-linejoin="round"/>
          <path d="M78 47 L116 18 L166 21 L204 56" fill="none" stroke="#090B12" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M132 35 L121 94 L151 105 L130 119 L132 148" fill="none" stroke="#090B12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M94 79 L119 69 L134 81" fill="none" stroke="#090B12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M147 74 L170 65 L190 79" fill="none" stroke="#090B12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M83 93 Q105 82 128 93 Q104 105 83 93 Z" fill="#FFF8DF" stroke="#090B12" stroke-width="3" stroke-linejoin="round"/>
          <path d="M147 88 Q170 76 194 87 Q171 99 147 88 Z" fill="#FFF8DF" stroke="#090B12" stroke-width="3" stroke-linejoin="round"/>
          <g class="iris">
            <ellipse cx="106" cy="93" rx="7.2" ry="8" fill="#272214"/>
            <ellipse cx="170" cy="87" rx="7.6" ry="8.5" fill="#416170"/>
          </g>
          <path class="scan" d="M73 104 H193" stroke="#52C7FF" stroke-width="2" stroke-linecap="round" opacity=".38"/>
          <path d="M96 149 Q121 158 166 145" fill="none" stroke="#090B12" stroke-width="3" stroke-linecap="round"/>
          <path d="M98 150 Q124 169 166 145 Q139 162 116 159 Z" fill="#FF7C5B" opacity=".82"/>
          <circle cx="184" cy="111" r="3.6" fill="#090B12"/>
          <path d="M86 120 L111 134 L100 153 Z" fill="#6A573E" opacity=".42"/>
          <path d="M156 111 L171 148 L143 123 Z" fill="#52C7FF" opacity=".23"/>
        </g>
        <circle cx="130" cy="100" r="78" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
        <circle cx="130" cy="100" r="63" fill="none" stroke="rgba(255,207,107,.18)" stroke-dasharray="4 10"/>
      </svg>
    </section>
    <div class="time" aria-live="polite"><span id="t">00:00<span class="cs">.00</span></span></div>
    <div class="controls">
      <button id="b2" type="button" disabled>랩</button>
      <button id="b1" type="button">시작</button>
      <button id="b3" type="button" disabled>초기화</button>
    </div>
    <div class="lap" id="lp"></div>
  </main>
<script>
(function(){
  var time=document.getElementById('t');
  var startButton=document.getElementById('b1');
  var lapButton=document.getElementById('b2');
  var resetButton=document.getElementById('b3');
  var lapText=document.getElementById('lp');
  var figure=document.getElementById('figure');
  var running=false,startAt=0,stored=0,timer=null,lastLap=0,laps=0;
  function elapsed(){return stored+(running?performance.now()-startAt:0);}
  function format(ms,markup){
    ms=Math.max(0,ms);
    var cent=Math.floor(ms/10),cc=cent%100,sec=Math.floor(cent/100),ss=sec%60,min=Math.floor(sec/60);
    var base=String(min).padStart(2,'0')+':'+String(ss).padStart(2,'0');
    return markup?base+'<span class="cs">.'+String(cc).padStart(2,'0')+'</span>':base+'.'+String(cc).padStart(2,'0');
  }
  function draw(){time.innerHTML=format(elapsed(),true);}
  function sync(){
    var value=elapsed();
    startButton.textContent=running?'정지':(value>0?'재개':'시작');
    startButton.classList.toggle('run',running);
    lapButton.disabled=!running;
    resetButton.disabled=running||value===0;
    figure.classList.toggle('run',running);
  }
  function start(){running=true;startAt=performance.now();timer=setInterval(draw,31);draw();sync();}
  function stop(){if(!running)return;stored=elapsed();running=false;clearInterval(timer);timer=null;draw();sync();}
  function reset(){running=false;clearInterval(timer);timer=null;stored=0;startAt=0;lastLap=0;laps=0;lapText.textContent='';draw();sync();}
  function lap(){if(!running)return;var now=elapsed(),split=now-lastLap;lastLap=now;laps+=1;lapText.textContent='구간 '+laps+'  +'+format(split,false);}
  startButton.addEventListener('click',function(){running?stop():start();});
  lapButton.addEventListener('click',lap);
  resetButton.addEventListener('click',reset);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)draw();});
  draw();sync();
})();
</script>
</body>
</html>
